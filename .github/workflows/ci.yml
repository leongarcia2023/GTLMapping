name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install ".[test]"
      - name: Test
        run: python -m pytest

  package-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install ".[dev]"
      - name: Build documentation
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - name: Build distributions
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Inspect wheel contents
        run: check-wheel-contents dist/*.whl
      - name: Smoke-test the installed wheel
        run: |
          python -m venv /tmp/gtlmapping-wheel-test
          /tmp/gtlmapping-wheel-test/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/gtlmapping-wheel-test/bin/python -c "import importlib.metadata as m; import gtlmapping; assert gtlmapping.__version__ == m.version('GTLMapping')"
          /tmp/gtlmapping-wheel-test/bin/gtlmapping --help
